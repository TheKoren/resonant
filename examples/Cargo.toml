[package]
name = "resonant-examples"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
resonant = { path = "../resonant" }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend", "bitmap_encoder", "line_series", "all_elements", "ttf",
] }

[[bin]]
name = "spectrum_visualiser"
path = "spectrum_visualiser.rs"

[[bin]]
name = "beat_detector"
path = "beat_detector.rs"

[[bin]]
name = "spectrogram"
path = "spectrogram.rs"

[[bin]]
name = "window_comparison"
path = "window_comparison.rs"
