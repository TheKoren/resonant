[package]
name = "resonant-filters"
description = "FIR/IIR filters and design helpers with compile-time domain safety"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio", "science"]
keywords = ["dsp", "filter", "biquad", "iir", "fir"]

[dependencies]
resonant-core = { version = "0.0.2", path = "../resonant-core" }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[features]
default = ["alloc"]
alloc = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fir"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
