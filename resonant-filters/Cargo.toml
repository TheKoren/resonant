[package]
name = "resonant-filters"
description = "FIR/IIR filters and design helpers with compile-time domain safety"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio", "science"]
keywords = ["dsp", "filter", "biquad", "iir", "fir"]

[dependencies]
resonant-core = { version = "0.4.0", path = "../resonant-core" }
resonant-fft = { version = "0.4.0", path = "../resonant-fft", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]
serde-alloc = ["serde", "alloc", "serde/alloc"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "fir"
harness = false

[[bench]]
name = "resample"
harness = false

[[bench]]
name = "nonlinear"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
