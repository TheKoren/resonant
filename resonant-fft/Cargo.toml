[package]
name = "resonant-fft"
description = "Type-safe FFT, STFT, and DCT transforms with compile-time domain tracking"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio", "science"]
keywords = ["dsp", "fft", "stft", "audio", "signal"]

[dependencies]
resonant-core = { version = "0.0.2", path = "../resonant-core" }
num-complex = { version = "0.4", default-features = false, features = ["libm"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
rustfft = { version = "6.4", optional = true }

[features]
default = ["rustfft"]
# alloc: enables extension traits (SignalFftExt, SignalFreqExt, SignalIfftExt) and
# STFT. Required when using Vec-returning APIs. Automatically enabled by rustfft.
alloc = []
rustfft = ["dep:rustfft", "alloc"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "magnitude"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
