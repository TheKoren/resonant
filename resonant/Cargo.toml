[package]
name = "resonant"
description = "Ergonomic audio DSP for Rust — FFT, filters, analysis in one line of code"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio"]
keywords = ["dsp", "audio", "fft", "signal", "analysis"]

[dependencies]
resonant-core = { version = "0.3.0", path = "../resonant-core" }
resonant-fft = { version = "0.3.0", path = "../resonant-fft" }
resonant-filters = { version = "0.3.0", path = "../resonant-filters" }
resonant-stream = { version = "0.3.0", path = "../resonant-stream" }
resonant-analysis = { version = "0.3.0", path = "../resonant-analysis" }
symphonia = { version = "0.5", default-features = false, features = [
    "wav", "pcm", "mp3", "flac", "ogg", "vorbis",
] }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "facade"
harness = false

[features]
default = []
serde = ["dep:serde", "resonant-fft/serde", "resonant-analysis/serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
