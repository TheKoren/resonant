[package]
name = "resonant"
description = "Ergonomic audio DSP for Rust — FFT, filters, analysis in one line of code"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio"]
keywords = ["dsp", "audio", "fft", "signal", "analysis"]

[dependencies]
resonant-core = { version = "0.0.2", path = "../resonant-core" }
resonant-fft = { version = "0.0.2", path = "../resonant-fft" }
resonant-filters = { version = "0.0.2", path = "../resonant-filters" }
resonant-stream = { version = "0.0.1", path = "../resonant-stream" }
resonant-analysis = { version = "0.0.1", path = "../resonant-analysis" }
symphonia = { version = "0.5", default-features = false, features = [
    "wav", "pcm", "mp3", "flac", "ogg", "vorbis",
] }

[features]
default = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
