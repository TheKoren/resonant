[package]
name = "resonant-core"
description = "no_std, zero-allocation DSP foundation with compile-time signal domain tracking"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["no-std", "embedded", "multimedia::audio"]
keywords = ["dsp", "signal", "no-std", "audio", "fft"]

[features]
default = []
alloc = []

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "window"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
