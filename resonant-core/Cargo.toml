[package]
name = "resonant-core"
description = "no_std, zero-allocation DSP foundation with compile-time signal domain tracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["no-std", "embedded", "multimedia::audio"]
keywords = ["dsp", "signal", "no-std", "audio", "fft"]

[features]
default = []
alloc = []

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
