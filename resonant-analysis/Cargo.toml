[package]
name = "resonant-analysis"
description = "High-level audio analysis: onset detection, beat tracking, pitch estimation, MFCCs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio", "science"]
keywords = ["dsp", "audio", "analysis", "pitch", "beat"]

[dependencies]
resonant-core = { version = "0.2.0", path = "../resonant-core", default-features = false, features = ["alloc"] }
resonant-fft = { version = "0.2.0", path = "../resonant-fft" }
resonant-filters = { version = "0.2.0", path = "../resonant-filters" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[features]
default = []
serde = ["dep:serde", "resonant-fft/serde"]

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
