[package]
name = "resonant-stream"
description = "Streaming DSP pipeline with pull-based processing and in-place chunks"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["multimedia::audio"]
keywords = ["dsp", "streaming", "audio", "pipeline"]

[dependencies]
resonant-core = { version = "0.3.0", path = "../resonant-core", default-features = false, features = ["alloc"] }
resonant-fft = { version = "0.3.0", path = "../resonant-fft" }
resonant-filters = { version = "0.3.0", path = "../resonant-filters" }

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
